<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senac - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            
            <div class="logo-area">
                <span class="logo-orange">▲</span>
                <span class="logo-text">Senac</span>
            </div>
            
            <div class="search-bar">
                <i class="bi bi-search search-icon"></i>
                <input type="text" placeholder="Buscar no portal">
            </div>

        </div>
    </header>

    <div class="orange-bar"></div>


    <main class="page-container">
        
        <div class="login-card">
            
            <div class="card-breadcrumb">
                Você está em: <span>Acesso</span> &gt; <span class="active">Login</span>
            </div>

            <div class="card-body">
                
                <div class="column-left">
                    <div class="pi-illustration-wrapper">
                        <div class="pi-circle-logo">
                            <span>PI</span>
                        </div>
                    </div>
                    
                    <div class="app-access">
                        <span>Acesso via App</span>
                        <div class="mock-qr-code">
                            <div class="qr-pattern"></div>
                        </div>
                    </div>
                </div>

                <div class="column-right">
                    <h2>Login</h2>
                    
                    <form class="login-form">
                        <div class="input-group">
                            <input type="text" placeholder="Email Institucional / CPF" required>
                        </div>
                        
                        <div class="input-group">
                            <input type="password" placeholder="Senha" required>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox"> Lembrar de mim
                            </label>
                            <a href="#" class="forgot-password">Esqueci minha senha?</a>
                        </div>

                        <a href="repositorio.html" class="btn-submit-link">Acessar</a>
                    </form>

                    <div class="card-footer-text">
                        não tem uma conta? <a href="cadastro.html">crie aqui</a>
                    </div>
                </div>

            </div>
        </div>

    </main>


    <footer class="page-footer">
        SENAC - Institutório de Projetos Integradores
    </footer>

</body>
</html>
